application:
  subdomain: xdl
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://xdl:47333/
services:
  xdl:
    # ghcr.io/missuo/xdl:v2.3.1
    # upstream: ghcr.io/missuo/xdl:2.3.1
    image: ghcr.1ms.run/missuo/xdl:2.3.1
    environment:
      - TZ=Asia/Shanghai
      - XDL_AUTH_TOKEN={{ .U.auth_token }}
      - XDL_API_TOKEN={{ .U.api_token }}
    binds:
      - /lzcapp/var/data:/data
      - /lzcapp/var/downloads:/downloads
